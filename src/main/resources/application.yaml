spring:
  application:
    name: task-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: ${PORT:8080}


